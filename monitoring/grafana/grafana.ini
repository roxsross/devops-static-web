[server]
http_port = 3000
domain = localhost
root_url = http://localhost:3001

[security]
admin_user = admin
admin_password = admin
allow_embedding = true

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false

[check_for_updates]
enabled = false

[log]
mode = console
level = info

[metrics]
enabled = true

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/devops-dashboard.json